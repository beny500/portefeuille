name: update-prices
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python update_prices.py
      - run: |
          git config user.name "prices-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Mise à jour des cours" && git push)
